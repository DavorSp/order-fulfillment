[project]
name = "order-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aio-pika>=9.4.0", "eventing", "python-dotenv>=1.0.0"]

[tool.uv.sources]
eventing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["order"]
